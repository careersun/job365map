# 每天自動從試算表更新職缺頁與 sitemap.xml
name: 更新 Google 求職職缺頁

on:
  schedule:
    - cron: "17 22 * * *"   # 每天台灣時間 06:17
    - cron: "17 4 * * *"    # 每天台灣時間 12:17
  workflow_dispatch:         # 可在 Actions 頁面手動執行

permissions:
  contents: write

# 同一時間只跑一個，避免排程和手動執行撞在一起
concurrency:
  group: build-jobs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 產生職缺頁
        run: node scripts/build-jobs.mjs

      - name: 有變更才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          msg="自動更新職缺頁 $(date -u +%F)"
          git add jobs sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          # 推送失敗（例如期間有人改了檔案）就同步最新版本、重新產生後再推
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-jobs.mjs
            git add jobs sitemap.xml
            git diff --cached --quiet && exit 0
            git commit -m "$msg"
          done
          exit 1
