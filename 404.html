<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面 | JOB365 職缺地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#12151C; --bg-panel:#191E27; --border:#2A3140;
    --text:#ECEDEF; --text-muted:#8B93A1; --text-faint:#5B6273;
    --gold:#F2A93D; --teal:#4FBFAE; --periwinkle:#7C93F2;
    --font-display:'Space Grotesk',sans-serif; --font-mono:'JetBrains Mono',monospace; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(ellipse 1500px 950px at 50% -10%, #263A5C 0%, #1B2740 38%, #161D2E 62%, var(--bg) 88%);
    color:var(--text);font-family:var(--font-body);
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;text-align:center;}
  .code{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase;margin-bottom:18px;}
  .pin{margin-bottom:20px;opacity:.9;}
  h1{font-family:var(--font-display);font-size:clamp(24px,5vw,34px);font-weight:700;margin:0 0 14px;line-height:1.35;}
  p{color:var(--text-muted);font-size:14.5px;line-height:1.8;margin:0 0 32px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1A1207;border:none;border-radius:999px;padding:13px 26px;font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;transition:filter .15s;}
  .btn:hover{filter:brightness(1.08);}
  .dots{position:fixed;inset:0;pointer-events:none;z-index:-1;}
  .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0;animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0;}50%{opacity:.7;}}
</style>
</head>
<body>

<div class="dots" id="dots"></div>

<div class="wrap">
  <div class="code">404 · Page Not Found</div>
  <div class="pin">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" stroke="#F2A93D" stroke-width="1.4"/><circle cx="12" cy="10" r="2.6" fill="#F2A93D"/></svg>
  </div>
  <h1>這個位置好像沒有職缺,<br>地圖上找不到這個地方</h1>
  <p>你要找的頁面不存在,可能是網址打錯了,或連結已經失效。回到職缺地圖,重新找找看適合的工作。</p>
  <a class="btn" href="./">← 回到職缺地圖</a>
</div>

<script>
  const dots = document.getElementById('dots');
  const colors = ['#F2A93D','#4FBFAE','#7C93F2'];
  for(let i=0;i<20;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.left = Math.random()*100+'%';
    d.style.top = Math.random()*100+'%';
    d.style.animationDelay = (Math.random()*4)+'s';
    d.style.background = colors[i%colors.length];
    dots.appendChild(d);
  }
</script>
</body>
</html>
