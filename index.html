<style>
  :root{
    --bg:#12151C; --bg-panel:#191E27; --bg-panel-hi:#212838; --border:#2A3140;
    --text:#ECEDEF; --text-muted:#8B93A1; --text-faint:#5B6273;
    --gold:#F2A93D; --teal:#4FBFAE; --coral:#E8674A; --periwinkle:#7C93F2; --violet:#C77DFF;
    --font-display:'Space Grotesk',sans-serif; --font-mono:'JetBrains Mono',monospace; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse 1500px 950px at 50% -10%, #263A5C 0%, #1B2740 38%, #161D2E 62%, var(--bg) 88%);background-attachment:fixed;color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}

  .bg-globe{position:fixed;top:50%;right:-160px;width:680px;height:680px;transform:translateY(-50%);z-index:-1;pointer-events:none;opacity:.5;}
  .bg-globe canvas{display:block;width:100%;height:100%;}
  @media (max-width:900px){ .bg-globe{width:420px;height:420px;right:-120px;opacity:.4;} }
  a{color:inherit;}
  ::selection{background:var(--gold);color:#12151C;}

  .nav{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);}
  .nav__logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.02em;}
  .hero__logo{height:44px;width:auto;display:block;margin:0 auto 18px;}
  .nav__links{display:flex;gap:22px;font-size:13px;color:var(--text-muted);}
  .nav__links a{text-decoration:none;transition:color .15s;}
  .nav__links a:hover{color:var(--gold);}

  .hero{position:relative;padding:56px 32px 32px;overflow:hidden;border-bottom:1px solid var(--border);}
  .hero__sky{position:absolute;inset:0;pointer-events:none;}
  .hero__dot{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0;animation:twinkle 4s ease-in-out infinite;}
  .shooting-star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 6px 1px rgba(255,255,255,.9);pointer-events:none;}
  .shooting-star::before{content:"";position:absolute;top:50%;right:50%;width:90px;height:1.5px;background:linear-gradient(90deg, transparent, rgba(255,255,255,.9));transform:translateY(-50%);}
  @keyframes twinkle{0%,100%{opacity:0;}50%{opacity:.85;}}
  .hero__content{position:relative;max-width:760px;margin:0 auto;text-align:center;}
  .hero__eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:14px;}
  .hero h1{font-family:var(--font-display);font-size:clamp(18px,5vw,40px);line-height:1.32;font-weight:700;margin:0 0 12px;white-space:nowrap;}
  .hero h1 span{color:var(--gold);}
  .hero p{color:var(--text-muted);font-size:14px;line-height:1.7;margin:0 auto 24px;max-width:520px;}

  .search{display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto 20px;background:var(--bg-panel);border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 18px;}
  .search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 0;}
  .search input::placeholder{color:var(--text-faint);}
  .search button{background:var(--gold);color:#1A1207;border:none;border-radius:999px;padding:12px 22px;font-family:var(--font-display);font-weight:600;font-size:14px;cursor:pointer;transition:filter .15s;white-space:nowrap;flex-shrink:0;}
  .search button:hover{filter:brightness(1.08);}

  .stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-bottom:24px;}
  .stats b{color:var(--text);font-size:16px;font-weight:600;}

  .filterbar{position:sticky;top:0;z-index:20;background:rgba(22,29,46,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--border);display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease, border-color .32s ease;contain:layout;}
  .filterbar__scroll{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px 32px;transition:padding .28s ease;}
  .filterbar.collapsed{grid-template-rows:0fr;border-bottom-color:transparent;}
  .filterbar.collapsed .filterbar__scroll{padding-top:0;padding-bottom:0;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .row--scroll{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:var(--border) transparent;
    padding-bottom:6px;
    margin-bottom:-6px;
    mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent 100%);
  }
  .row--scroll .row__label{flex-shrink:0;}
  .row--scroll .chip{flex-shrink:0;}
  .row--scroll::-webkit-scrollbar{height:5px;}
  .row--scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .row--scroll::-webkit-scrollbar-track{background:transparent;}
  .row__label{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;width:52px;flex-shrink:0;}
  .tab{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-body);font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .15s;}
  select.tab{-webkit-appearance:none;-moz-appearance:none;appearance:none;padding-right:26px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238B93A1'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}
  select.tab:focus{outline:none;border-color:var(--text-muted);}
  select.tab option{background:var(--bg-panel);color:var(--text);}
  .tab:hover{border-color:var(--text-muted);color:var(--text);}
  .tab.active{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600;}
  #regionRow .tab.active{background:var(--periwinkle);border-color:var(--periwinkle);color:#0E1220;}
  #sortRow .tab.active{background:var(--teal);border-color:var(--teal);color:#0E1220;}

  .chip{background:transparent;border:1px solid var(--border);font-family:var(--font-body);font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;color:var(--text-muted);}
  .chip__dot{width:8px;height:8px;border-radius:50%;}
  .chip:hover{color:var(--text);}
  .chip.active{color:var(--text);border-color:var(--chip-color,var(--text));background:color-mix(in srgb, var(--chip-color,var(--text)) 14%, transparent);}

  .remote-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);cursor:pointer;margin-left:auto;}
  .remote-toggle input{accent-color:var(--teal);}
  .clear-btn{background:none;border:none;color:var(--text-faint);font-size:12px;text-decoration:underline;cursor:pointer;}
  .clear-btn:hover{color:var(--coral);}

  .results-head{display:flex;justify-content:space-between;align-items:baseline;padding:24px 32px 4px;font-size:13px;color:var(--text-muted);flex-wrap:wrap;gap:6px;}
  .results-head b{color:var(--text);font-family:var(--font-mono);}
  .hint{font-size:12px;color:var(--text-faint);}
  .hint button{background:none;border:none;color:var(--periwinkle);cursor:pointer;text-decoration:underline;font-size:12px;padding:0;}

  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px 32px 48px;}
  .card{position:relative;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:18px 18px 16px 22px;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;overflow:hidden;display:flex;flex-direction:column;animation:cardFadeIn .45s ease backwards;}
  @keyframes cardFadeIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--card-color,var(--teal));}
  .card:hover{transform:translateY(-2px);background:var(--bg-panel-hi);border-color:var(--text-faint);}
  .card.highlight{
    border-color:#fff;
    background:var(--bg-panel-hi);
    box-shadow:0 0 0 2px #fff, 0 0 24px 4px rgba(255,255,255,.45), 0 8px 20px rgba(0,0,0,.35);
    animation:cardGlow 1.8s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{ box-shadow:0 0 0 2px #fff, 0 0 24px 4px rgba(255,255,255,.45), 0 8px 20px rgba(0,0,0,.35); }
    50%{ box-shadow:0 0 0 2px #fff, 0 0 34px 8px rgba(255,255,255,.7), 0 8px 20px rgba(0,0,0,.35); }
  }
  .card__top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{font-family:var(--font-mono);font-size:10.5px;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;}
  .badge--cat{background:color-mix(in srgb, var(--card-color) 18%, transparent);color:var(--card-color);}
  .badge--remote{background:rgba(79,191,174,.15);color:var(--teal);}
  .badge--overseas{background:rgba(124,147,242,.15);color:var(--periwinkle);}
  .badge--type{background:rgba(139,147,161,.15);color:var(--text-muted);}
  .badge--new{background:rgba(242,169,61,.15);color:var(--gold);}
  .card__title{font-family:var(--font-display);font-size:17.5px;font-weight:700;margin:0 0 5px;line-height:1.4;}
  .card__company-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .card__company{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:0;}
  .company-avatar{flex-shrink:0;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:11px;}
  .card__meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .card__meta .mono{font-family:var(--font-mono);}
  .card__meta-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
  .meta-row{display:flex;gap:8px;font-size:12.5px;line-height:1.5;}
  .meta-row__icon{flex-shrink:0;width:16px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);padding-top:1px;}
  .meta-row__value{color:var(--text-muted);}
  .card__footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;}
  .card__views{font-size:11.5px;color:var(--text-faint);}
  .card__go{font-family:var(--font-mono);font-size:12.5px;color:var(--text-faint);text-decoration:none;}
  .share-job-btn{display:block;width:100%;margin:14px 0 0;padding:11px;background:var(--bg-panel-hi);border:1px solid var(--border);border-radius:10px;color:var(--text-muted);font-family:var(--font-body);font-size:13px;cursor:pointer;transition:border-color .15s, color .15s;}
  .share-job-btn:hover{border-color:var(--periwinkle);color:var(--text);}
  .card__go[href]:hover{color:var(--gold);}
  .empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-faint);font-size:14px;}
  .skeleton-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:18px;height:180px;overflow:hidden;position:relative;}
  .skeleton-card::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent);transform:translateX(-100%);animation:skeletonShine 1.6s ease-in-out infinite;}
  @keyframes skeletonShine{ 100%{ transform:translateX(100%); } }
  .skeleton-line{background:var(--bg-panel-hi);border-radius:6px;margin-bottom:10px;}
  .btn-reset-filters{margin-top:16px;background:var(--gold);color:#1A1207;border:none;border-radius:999px;padding:11px 24px;font-family:var(--font-display);font-weight:600;font-size:13.5px;cursor:pointer;}
  .btn-reset-filters:hover{filter:brightness(1.08);}

  .map-section{padding:0 32px 64px;}
  .map-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .map-head h2{font-family:var(--font-display);font-size:20px;margin:0;font-weight:600;}
  .map-head p{margin:0;font-size:12px;color:var(--text-faint);font-family:var(--font-mono);}
  #map{height:460px;border-radius:14px;border:1px solid var(--border);position:relative;z-index:1;isolation:isolate;}
  @keyframes markerPulse{
    0%{ box-shadow:0 0 0 0 var(--pulse-color, rgba(242,169,61,.6)); }
    70%{ box-shadow:0 0 0 14px transparent; }
    100%{ box-shadow:0 0 0 0 transparent; }
  }
  .marker-active-pulse{ animation:markerPulse 1.4s ease-out 2; }
  .maplibregl-popup{animation:popupFadeIn .2s ease;}
  @keyframes popupFadeIn{ from{opacity:0;} to{opacity:1;} }
  .maplibregl-popup-content{background:var(--bg-panel);color:var(--text);border-radius:10px;}
  .maplibregl-popup-tip{border-top-color:var(--bg-panel);border-bottom-color:var(--bg-panel);}
  .maplibregl-popup-close-button{
    top:8px;right:8px;width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-panel);color:var(--text-muted);
    border:1px solid var(--border);border-radius:50%;
    font-size:15px;line-height:1;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    transition:all .15s;
  }
  .maplibregl-popup-close-button:hover{color:var(--text);border-color:var(--text-muted);background:var(--bg-panel);}
  .popup__cat{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--pop-color,var(--teal));}
  .popup__title{font-weight:600;font-size:14px;margin:2px 0;}
  .popup__meta{font-size:12px;color:var(--text-muted);}
  .popup__hint{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--pop-color,var(--gold));display:flex;align-items:center;gap:5px;animation:hintPulse 1.5s ease-in-out infinite;cursor:pointer;}
  @keyframes hintPulse{ 0%,100%{opacity:.65;} 50%{opacity:1;} }
  .popup__hint-arrow{display:inline-block;animation:hintNudge 1.5s ease-in-out infinite;}
  @keyframes hintNudge{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(3px);} }

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text-muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* 地圖標記點擊後,置中顯示的職缺詳情視窗 */
  .job-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(10,12,17,.72);backdrop-filter:blur(3px);z-index:1000;align-items:center;justify-content:center;padding:24px;}
  .job-modal-backdrop.open{display:flex;}
  .job-modal{position:relative;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:var(--bg-panel-hi);border:1px solid var(--border);border-radius:16px;padding:24px 24px 20px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);animation:modalPop .22s ease;}
  @keyframes modalPop{ from{opacity:0; transform:scale(.94) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .job-modal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:16px 0 0 16px;background:var(--card-color,var(--teal));transition:background .25s ease;}
  #jobModalBody{transition:opacity .18s ease, transform .18s ease;}
  #jobModalBody.switching{opacity:0;transform:translateY(8px) scale(.985);}
  .job-modal__close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg-panel);color:var(--text-muted);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .job-modal__close:hover{color:var(--text);border-color:var(--text-muted);}
  .job-modal .card__top{margin-right:30px;}
  #jobModalBody .meta-row__value{color:var(--text);font-size:13.5px;}
  #jobModalBody .meta-row__icon{color:var(--text-muted);}
  #jobModalBody .meta-row{font-size:13.5px;line-height:1.6;}
  #jobModalBody .card__title{font-size:21px;}
  #jobModalBody .card__company{color:var(--text-muted);}
  .job-modal__nearby{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);}
  .job-modal__nearby-label{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-bottom:8px;letter-spacing:.02em;}
  .job-modal__nearby-list{display:flex;flex-direction:column;gap:6px;}
  .nearby-chip{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer;transition:all .15s;color:var(--text);font-family:var(--font-body);}
  .nearby-chip:hover{border-color:var(--chip-color,var(--teal));background:color-mix(in srgb, var(--chip-color,var(--teal)) 12%, transparent);transform:translateX(2px);}
  .nearby-chip__dot{width:8px;height:8px;border-radius:50%;background:var(--chip-color,var(--teal));flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb, var(--chip-color,var(--teal)) 25%, transparent);}
  .nearby-chip__text{font-size:12.5px;line-height:1.45;flex:1;}
  .nearby-chip__text small{display:block;color:var(--text-faint);font-size:11px;margin-top:1px;}
  .nearby-chip__arrow{color:var(--text-faint);font-size:14px;flex-shrink:0;}

  footer{border-top:1px solid var(--border);padding:22px 32px;font-size:11.5px;color:var(--text-faint);line-height:1.7;}

  .filter-fab{display:none;}
  .back-to-top{
    display:flex;align-items:center;gap:6px;
    position:fixed;right:18px;bottom:18px;z-index:44;
    background:var(--bg-panel-hi);color:var(--text-muted);
    border:1px solid var(--border);border-radius:999px;
    padding:11px 18px;font-family:var(--font-display);font-weight:600;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer;
    opacity:0;visibility:hidden;transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s, border-color .15s, color .15s;
  }
  .back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0);}
  .back-to-top:hover{color:var(--text);border-color:var(--text-muted);}
  .filter-backdrop{display:none;}
  .filter-sheet-header{display:none;}
  .filter-sheet-apply{display:none;}

  @media (max-width:720px){
    .nav__links{display:none;}
    .hero{padding:44px 16px 28px;}
    .hero p{font-size:13px;}
    .search{padding:5px 5px 5px 14px;}
    .search input{font-size:13.5px;}
    .search button{padding:11px 16px;font-size:13px;}
    .results-head, .list, .map-section{padding-left:16px;padding-right:16px;}
    .row__label{width:auto;margin-right:2px;font-size:14px;}
    .sheet-panel__row{flex-direction:column;}

    /* 篩選浮動按鈕 */
    .filter-fab{display:flex;align-items:center;gap:7px;position:fixed;right:18px;bottom:18px;z-index:45;background:var(--gold);color:#1A1207;border:none;border-radius:999px;padding:13px 20px;font-family:var(--font-display);font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(242,169,61,.4);cursor:pointer;transition:opacity .15s, visibility .15s;}
    .back-to-top{bottom:78px;padding:10px 16px;font-size:12.5px;}
    .filter-fab.is-hidden{opacity:0;visibility:hidden;pointer-events:none;}
    .filter-fab__badge{background:#1A1207;color:var(--gold);border-radius:999px;font-size:11px;font-family:var(--font-mono);padding:1px 7px;min-width:16px;text-align:center;}

    /* 背景遮罩 */
    .filter-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;}
    .filter-backdrop.open{opacity:1;pointer-events:auto;}

    /* 篩選面板變成底部滑出 */
    .filterbar{
      position:fixed;left:0;right:0;bottom:-100%;top:auto;
      max-height:82vh;
      border-radius:22px 22px 0 0;
      border:1px solid var(--border);border-bottom:none;
      box-shadow:0 -12px 36px rgba(0,0,0,.5);
      transition:bottom .28s ease;
      z-index:50;
      background:var(--bg-panel); /* 改成跟標題列一致的不透明底色,不再用半透明毛玻璃,避免色塊對不齊 */
      backdrop-filter:none;
      overflow:hidden; /* 只負責圓角裁切 */
      padding:0; /* 覆蓋桌面版殘留的 padding:16px 32px,否則外框跟內層寬度會對不齊 */
      display:flex;
      flex-direction:column;
      gap:0;
    }
    .filterbar__scroll{
      display:flex;
      flex-direction:column;
      gap:18px;
      flex:1 1 auto;
      min-height:0; /* 讓 flex 子項目能正確被裁切捲動,而不是把父層撐開 */
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:18px 16px 12px;
    }
    .filterbar.open{bottom:0;}
    .filterbar .tab, .filterbar .chip{font-size:15px;padding:9px 16px;}
    .filterbar select.tab{border-radius:999px;}
    .row--actions{flex-direction:column;align-items:stretch;gap:12px;}
    .row--actions .row__label{display:none;}
    .row--actions .remote-toggle{margin-left:0;justify-content:flex-start;font-size:15px;}
    .row--actions .clear-btn{width:100%;text-align:center;font-size:14px;}

    .filter-sheet-header{position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:19px;padding:16px 16px 14px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg-panel);text-align:center;}
    .filter-sheet-close{position:absolute;right:10px;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;padding:8px;}

    .filter-sheet-apply{display:block;flex-shrink:0;background:var(--bg-panel);padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--border);}
    .filter-sheet-apply button{width:100%;background:var(--gold);color:#1A1207;border:none;border-radius:999px;padding:15px;font-family:var(--font-display);font-weight:600;font-size:16px;cursor:pointer;}
  }
</style>
</head>

// 流星:隨機位置、角度、間隔劃過星空區,動畫結束後自動移除
function spawnShootingStar(){
  const star = document.createElement('div');
  star.className = 'shooting-star';
  const startX = Math.random()*65; // % 由右側出發,預留飛行空間
  const startY = Math.random()*35; // % 只在上半部出現,較貼近星空感
  const angle = -25 - Math.random()*30; // 飛行角度(往左下方劃過)
  const distance = 220 + Math.random()*180;
  const rad = angle * Math.PI/180;
  const dx = Math.cos(rad)*distance;
  const dy = Math.sin(rad)*distance;
  star.style.left = startX+'%';
  star.style.top = startY+'%';
  sky.appendChild(star);
  const anim = star.animate([
    { transform:`translate(0,0) rotate(${angle}deg)`, opacity:0 },
    { transform:`translate(0,0) rotate(${angle}deg)`, opacity:1, offset:0.08 },
    { transform:`translate(${dx*0.85}px, ${dy*0.85}px) rotate(${angle}deg)`, opacity:1, offset:0.7 },
    { transform:`translate(${dx}px, ${dy}px) rotate(${angle}deg)`, opacity:0 },
  ], { duration: 1200 + Math.random()*700, easing:'linear' });
  anim.onfinish = ()=> star.remove();
}
setInterval(()=>{ if(Math.random()<0.55) spawnShootingStar(); }, 2400);

function deriveCategories(data){
  const set = [...new Set(data.map(j=>j.category).filter(Boolean))];
  const map = {};
  set.forEach((c,i)=> map[c]=PALETTE[i%PALETTE.length]);
  return {cats:set, colorMap:map};
}

// 台灣縣市由北到南、東部、離島的地理順序,用來排序縣市選單;不在清單裡的(例如海外城市、或包含區名的完整地址)會排在最後面,彼此之間維持原本字母排序
const TAIWAN_CITY_ORDER = [
  '基隆','台北','臺北','新北','桃園','新竹市','新竹縣','新竹',
  '苗栗','台中','臺中','彰化','南投','雲林',
  '嘉義市','嘉義縣','嘉義','台南','臺南','高雄','屏東',
  '宜蘭','花蓮','台東','臺東',
  '澎湖','金門','連江'
];
function cityRank(city){
  const idx = TAIWAN_CITY_ORDER.findIndex(name=> city.includes(name));
  return idx === -1 ? TAIWAN_CITY_ORDER.length : idx;
}

function rebuildCityUI(){
  const cityFilter = document.getElementById('cityFilter');
  const cities = [...new Set(DATA.map(j=>j.city).filter(Boolean))].sort((a,b)=>{
    const rankDiff = cityRank(a) - cityRank(b);
    return rankDiff !== 0 ? rankDiff : a.localeCompare(b,'zh-Hant');
  });
  cityFilter.innerHTML = '<option value="all">全部縣市</option>' + cities.map(c=> `<option value="${c}">${c}</option>`).join('');
  state.city = 'all';
  cityFilter.value = 'all';
}

function buildDynamicChipRow(rowId, field, stateSet, uniformColor){

  const colorMap = {};
  values.forEach((v,i)=> colorMap[v] = uniformColor || PALETTE[i%PALETTE.length]);
  stateSet.clear();
  const row = document.getElementById(rowId);
  row.querySelectorAll('.chip').forEach(el=> el.remove());
  values.forEach(v=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.style.setProperty('--chip-color', colorMap[v]);
    b.innerHTML = `<span class="chip__dot" style="background:${colorMap[v]}"></span>${v}`;
    b.dataset.key = v;
    b.onclick = ()=>{ if(stateSet.has(v)) stateSet.delete(v); else stateSet.add(v); update(); };
    row.appendChild(b);
  });
  return { values, colorMap };
}

/* ---------------- FILTER / SORT LOGIC ---------------- */
function matchesRegion(job){
  switch(state.region){
    case 'taiwan': return !job.overseas;
    case 'overseas': return job.overseas;
    case 'foreign': return job.type === '外商';
    case 'local': return job.type === '本土';
    default: return true;
  }
}
function isNew(job){ return (today - job.updated) / 86400000 <= 7; }
function getFiltered(){
  let arr = DATA.filter(job=>{
    if(!matchesRegion(job)) return false;
    if(state.city && state.city !== 'all' && job.city !== state.city) return false;
    if(state.cats.size && !state.cats.has(job.category)) return false;
    if(state.shifts.size && !state.shifts.has(job.shift)) return false;
    if(state.rests.size && !state.rests.has(job.restDay)) return false;
    if(state.remoteOnly && !job.remote) return false;
    if(state.sort==='remote' && !job.remote) return false; // 「全遠端」不再只是排序,點了就真的只顯示可遠端職缺
    if(state.query){
      const tokens = state.query.split(/\s+/).filter(Boolean);
      const hay = `${job.company} ${job.title} ${job.city} ${job.category} ${job.type}`.toLowerCase();
      if(!tokens.every(t=> hay.includes(t.toLowerCase()))) return false;
    }
    return true;
  });
  if(state.sort==='daily') arr = dailyShuffle(arr);
  if(state.sort==='hot') arr.sort((a,b)=> b.views - a.views);
  if(state.sort==='remote') arr.sort((a,b)=> (b.remote-a.remote) || (b.views-a.views));
  if(state.sort==='new') arr.sort((a,b)=> b.updated - a.updated);
  return arr;
}

// 依「今天的日期」當固定種子做洗牌:同一天所有人看到的順序都一樣,換一天自動變成不同順序,不用手動操作、不看任何數據
function seededRandom(seed){
  let s = seed % 2147483647;
  if(s <= 0) s += 2147483646;
  return function(){
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function dailySeed(){
  const d = new Date();
  const dateStr = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  let hash = 0;
  for(let i=0;i<dateStr.length;i++){ hash = (hash*31 + dateStr.charCodeAt(i)) | 0; }
  return Math.abs(hash) || 1;
}
function dailyShuffle(arr){
  const rand = seededRandom(dailySeed());
  return arr
    .map(job => ({ job, key: rand() }))
    .sort((a,b) => a.key - b.key)
    .map(x => x.job);
}

// 直線距離估算(公里),用來排序「附近職缺」,不需要非常精準
function distKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getNearbyJobs(job, limit){
  return getFiltered()
    .filter(j=> j.id!==job.id && j.lat!=null && j.lng!=null && !isNaN(j.lat) && !isNaN(j.lng))
    .map(j=> ({ job:j, dist: distKm(job.lat, job.lng, j.lat, j.lng) }))
    .sort((a,b)=> a.dist - b.dist)
    .slice(0, limit);
}
function nearbyJobsHTML(job){
  const nearby = getNearbyJobs(job, 3);
  if(!nearby.length) return '';
  return `
    <div class="job-modal__nearby">
      <div class="job-modal__nearby-label">✦ 附近還有這些職缺,點一下切換看看</div>

  `;
}

// 把真實點閱數寫回試算表(每次打開都會累加,但同一筆職缺短時間內重複打開只算一次,避免手滑連點洗數字)
const RECENT_VIEW_COOLDOWN_MS = 3000; // 幾秒內重複點開同一則職缺不重複計算,可依需求調整
const recentViewTimestamps = {};
function recordRealView(job){
  if(!APPS_SCRIPT_URL || !job._row) return;
  const now = Date.now();
  const last = recentViewTimestamps[job._row] || 0;
  if(now - last < RECENT_VIEW_COOLDOWN_MS) return; // 剛剛才點過,視為手滑連點,不重複計算
  recentViewTimestamps[job._row] = now;
  job.views = (job.views || 0) + 1; // 先在畫面上樂觀更新,不用等後端回應
  document.querySelectorAll(`[data-views-for="${job.id}"]`).forEach(el=>{
    el.textContent = `${job.views} 次點閱 · ${job.applications || 0} 次應徵`;
  });
  fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'incrementView', row: job._row })
  }).catch(()=>{}); // 寫入失敗就算了,不影響畫面上的使用體驗,下次重新整理會抓到試算表裡實際的數字
}

// ---------------- 職缺分享連結 ----------------
// 用公司+職稱組合成網址參數,不用改試算表結構、不用額外的 id 欄位
function jobSlugRaw(job){
  return `${job.company}_${job.title}`.replace(/\s+/g,'');
}
function jobShareUrl(job){
  return `${location.origin}${location.pathname}?job=${encodeURIComponent(jobSlugRaw(job))}`;
}
function findJobBySlug(slug){
  return DATA.find(j=> jobSlugRaw(j) === slug);
}
// 頁面載入時,如果網址帶有 ?job=xxx,自動開啟對應的職缺詳情(用於分享單一職缺連結)
function openJobFromUrlParam(){
  const slug = new URLSearchParams(location.search).get('job'); // URLSearchParams 會自動解碼,所以這裡拿到的已經是原始字串
  if(!slug) return;
  const job = findJobBySlug(slug);
  if(!job){ console.warn('職缺地圖:網址帶的職缺參數找不到對應職缺 —', slug); return; }
  console.info('職缺地圖:從分享連結開啟職缺 —', job.title, job.company);
  setActiveMarker(job.id);
  setTimeout(()=> showJobModal(job, false), 300); // 稍微延遲,確保地圖跟卡片都已經渲染完成
}
async function shareJob(job, btnEl){
  const url = jobShareUrl(job);
  try{
    if(navigator.share){
      await navigator.share({ title: `${job.title} - ${job.company}`, url });
      return;
    }
    await navigator.clipboard.writeText(url);
    if(btnEl){
      const original = btnEl.textContent;
      btnEl.textContent = '已複製連結 ✓';
      setTimeout(()=>{ btnEl.textContent = original; }, 1800);
    }
  }catch(err){
    prompt('複製這個連結分享:', url);
  }
}

// 在彈窗內直接切換到附近的另一個職缺,不用先關閉視窗
function switchToJob(id){
  const job = DATA.find(j=>j.id===id);
  if(!job) return;
  setActiveMarker(id);
  showJobModal(job, true);
  if(job.lat!=null && job.lng!=null){
    map.panTo([job.lng, job.lat], { duration:550, essential:true });
  }
}

// 關閉視窗後,讓地圖上附近幾個標記輕輕脈動,引導使用者繼續點其他地方
function pulseNearbyMarkers(job){
  if(!job || job.lat==null || job.lng==null) return;
  getNearbyJobs(job, 4).forEach(({job:j})=>{
    const m = markers[j.id];
    const inner = m && m.getElement && m.getElement();
    if(inner){
      inner.classList.remove('marker-active-pulse');
      void inner.offsetWidth; // 強制 reflow,讓動畫可以重新觸發
      inner.classList.add('marker-active-pulse');
      setTimeout(()=> inner.classList.remove('marker-active-pulse'), 3000);
    }
  });
}

// 只切換哪個 marker 是「目前選中」的狀態,重用既有的 marker DOM,不整批砍掉重建
// (整批重建會讓每個 marker 變成全新元素,原本設定好的 transition 就沒有起點可以動畫,看起來像用跳的)
function setActiveMarker(newId){
  state.activeId = newId;
  Object.entries(markers).forEach(([jid, m])=>{
    const el = m.getElement && m.getElement();
    if(!el) return;
    const isActive = Number(jid) === Number(newId);
    const job = DATA.find(j=> j.id === Number(jid));
    const color = (job && (CAT_COLOR[job.category] || COLORS.teal)) || COLORS.teal;
    const s = isActive ? 24 : 12;
    el.style.width = s+'px';
    el.style.height = s+'px';
    el.style.boxShadow = `0 0 0 ${isActive?5:0}px ${color}55`;
    el.classList.remove('marker-active-pulse');
    if(isActive){
      void el.offsetWidth; // 強制 reflow,讓脈動動畫可以重新觸發
      el.classList.add('marker-active-pulse');
      setTimeout(()=> el.classList.remove('marker-active-pulse'), 3000);
    }
  });
  document.querySelectorAll('.card').forEach(c=> c.classList.toggle('highlight', Number(c.dataset.id)===Number(newId)));
}

/* ---------------- RENDER MAP ---------------- */
function renderMap(items){
  Object.values(markers).forEach(m=> m.remove());
  markers = {};
  items.forEach(job=>{
    if(job.lat==null || job.lng==null || isNaN(job.lat) || isNaN(job.lng)) return;
    const color = CAT_COLOR[job.category] || COLORS.teal;
    const el = makeMarkerEl(color, job.id===state.activeId);
    const popup = new maplibregl.Popup({ offset: 14 }).setHTML(`<div style="--pop-color:${color}"><div class="popup__cat">${job.category}</div><div class="popup__title">${job.title}</div><div class="popup__meta">${job.company} · ${job.city}${job.remote?' · 可遠端':''}</div><div class="popup__hint" data-id="${job.id}">點一下查看完整詳情<span class="popup__hint-arrow">→</span></div></div>`);
    popup.on('open', ()=>{
      const hintEl = popup.getElement()?.querySelector('.popup__hint');
      if(hintEl) hintEl.addEventListener('click', ()=> switchToJob(job.id));
    });
    const m = new maplibregl.Marker({ element: el }).setLngLat([job.lng, job.lat]).setPopup(popup).addTo(map);
    el.addEventListener('click', ()=> switchToJob(job.id));
    markers[job.id] = m;
  });
}

// 捲動時確保整張卡片(或至少從頂端開始)都露在可視範圍內,不被桌面版展開後的篩選列蓋住
function scrollCardFullyIntoView(el){
  const filterbarEl = document.getElementById('filterbar');
  const isDesktop = window.matchMedia('(min-width: 721px)').matches;
  // 捲到卡片時篩選列會是展開狀態,所以用「完整展開的高度」估算遮擋範圍,不管目前是不是收合中
  const topOverlay = isDesktop ? filterbarEl.scrollHeight : 0;
  const viewportH = window.innerHeight;
  const availableH = viewportH - topOverlay;
  const rect = el.getBoundingClientRect();
  const cardHeight = rect.height;
  let desiredTop;
  if(cardHeight <= availableH){
    desiredTop = topOverlay + Math.max(16, (availableH - cardHeight) / 2);
  } else {
    desiredTop = topOverlay + 16; // 卡片本身比可視範圍還高,對齊到遮擋物下方,盡量從頭露出
  }
  const scrollDelta = rect.top - desiredTop;
  window.scrollBy({ top: scrollDelta, behavior:'smooth' });
}

function focusJob(id, flyMap){
  const job = DATA.find(j=>j.id===id);
  setActiveMarker(id);
  if(job && flyMap && job.lat!=null && job.lng!=null){
    const targetZoom = job.overseas ? 7 : 14; // 放大幅度加強,尤其是台灣本地職缺會拉得更近
    const doFly = ()=>{
      map.flyTo({ center:[job.lng, job.lat], zoom: targetZoom, duration:900, essential:true });
      // 等飛行動畫真正結束(moveend)才開彈窗,不用猜時間點,飛行跟開窗才不會打架
      map.once('moveend', ()=> { markers[id] && markers[id].togglePopup(); });
    };
    // 先捲動到地圖區塊,等捲動實際結束後才開始飛行聚焦,順序清楚不會兩個動作打架(桌面版、手機版都適用)
    let flown = false;
    const startFly = ()=>{ if(flown) return; flown = true; doFly(); };
    if('onscrollend' in window){
      window.addEventListener('scrollend', startFly, { once:true });
      setTimeout(startFly, 1200); // 保險:萬一瀏覽器沒有觸發 scrollend,還是要飛
    } else {
      setTimeout(startFly, 500); // 不支援 scrollend 的瀏覽器退回固定延遲
    }
    document.getElementById('map').scrollIntoView({ behavior:'smooth', block:'center' });
  }
  if(job && !flyMap){
    const cardEl = document.querySelector(`.card[data-id="${id}"]`);
    if(cardEl) scrollCardFullyIntoView(cardEl);
  }
}

  document.getElementById('countTotal').textContent = DATA.length;
  const hiddenRemote = DATA.filter(j=> j.remote && !state.remoteOnly && !filtered.includes(j)).length;

    document.getElementById('showRemoteBtn').onclick = ()=>{ state.remoteOnly=true; document.getElementById('remoteOnly').checked=true; update(); };
  } else { hintEl.textContent = ''; }
  renderList(filtered);
  renderMap(filtered);

  // 保險:結果 0 筆時頁面會變很短,直接強制展開篩選列,避免自動收合邏輯誤判卡住
  if(filtered.length === 0){

  const activeCount = (state.region!=='all'?1:0) + (state.city!=='all'?1:0) + (state.sort!=='daily'?1:0)

  badge.textContent = activeCount;
  badge.style.display = activeCount>0 ? 'inline-block' : 'none';
  document.getElementById('applyCount').textContent = filtered.length;
}

const HEADER_ALIASES = {
  company:['company','公司','公司名稱','公司名稱(中文)'],
  title:['title','job','職稱','職位','職務'],
  category:['category','職能','分類','類別'],
  city:['city','城市','地點','縣市'],
  lat:['lat','緯度','latitude','經度(緯度)'],
  lng:['lng','經度','longitude','lon','經度(經度)'],
  remote:['remote','遠端','可遠端','是否遠端','遠端工作'],
  overseas:['overseas','海外','外商','外派'],
  type:['type','類型','職務類型'],
  views:['views','點閱','點閱數','views_count'],
  updated:['updated','更新日期','date','更新','last_updated'],
  link:['link','url','連結','官網連結','官方連結','apply_link'],
  salary:['salary','薪資','薪水','薪資待遇','待遇','pay'],
  workHours:['workhours','work_hours','上班時間','工作時間','時間'],
  shift:['shift','班別','班次'],
  restDay:['restday','rest_day','休假','公休','排休','休假制度'],
  benefits:['benefits','福利','員工福利','福利制度'],
  info:['info','職缺資訊','資訊','說明','備註','description','note','條件','應徵條件','要求'],
  applications:['applications','應徵次數','應徵人數','apply_count']
};

function normHeader(h){
  // 去除不可見字元、全形空白、前後空白，轉小寫並移除內部空白
  return String(h || '')
    .replace(/[\u200B-\u200F\uFEFF]/g,'') // invisible chars
    .replace(/\u3000/g,' ') // 全形空白轉半形
    .trim()
    .toLowerCase()
    .replace(/\s+/g,'');
}

function buildHeaderMap(headers){
  const map = {};
  if(!Array.isArray(headers)) return map;
  headers.forEach(h=>{
    const norm = normHeader(h);
    for(const [key, aliases] of Object.entries(HEADER_ALIASES)){
      if(aliases.some(a=> normHeader(a) === norm)){
        map[key] = h; // 保留原始 header 名稱以便 row[map[key]] 使用
        return;
      }
    }
    // 若沒對上，仍把原始 header 記錄為 colN 以免遺失欄位
    const idx = headers.indexOf(h);
    map[`col${idx}`] = h;
  });
  return map;
}

function parseBool(v){
  if(v === undefined || v === null) return false;
  const s = String(v).trim().toLowerCase();
  return ['true','1','是','yes','y','v','✓','remote','t','on'].includes(s);
}

function rowToJob(row, map, idx){
  const get = k => map[k] ? String(row[map[k]] ?? '').trim() : '';
  const city = get('city');
  let lat = parseFloat(get('lat').replace(/,/g,'')) || NaN;
  let lng = parseFloat(get('lng').replace(/,/g,'')) || NaN;
  if((isNaN(lat) || isNaN(lng)) && findCityCoords(city)){ [lat,lng] = findCityCoords(city); }
  const updatedRaw = get('updated');
  const updatedDate = updatedRaw ? new Date(updatedRaw) : new Date();
  return {
    id: idx+1,
    _row: idx+2, // 對應試算表實際列號(第1列是標題),寫回點閱數/應徵次數時要用
    company: get('company') || '',
    title: get('title') || '',
    category: get('category') || '其他',
    city: city || '未提供地點',
    lat: isNaN(lat) ? null : lat,
    lng: isNaN(lng) ? null : lng,
    remote: parseBool(get('remote')),
    overseas: parseBool(get('overseas')),
    type: get('type') || '未提供',
    views: (parseInt(get('views').replace(/,/g,'')) || 0),
    applications: (parseInt(get('applications').replace(/,/g,'')) || 0),
    updated: isNaN(updatedDate.getTime()) ? new Date() : updatedDate,
    link: (get('link') || null),
    salary: (get('salary') || ''),
    info: (get('info') || ''),
    workHours: (get('workHours') || ''),
    shift: (get('shift') || ''),
    restDay: (get('restDay') || ''),
    benefits: (get('benefits') || '')
  };
}

async function loadFromSheet(url){
  try{
    console.info('職缺地圖:開始從試算表載入', url);
    const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if(!idMatch) throw new Error('這不像是有效的 Google 試算表連結 (找不到 id)');
    const gidMatch = url.match(/gid=([0-9]+)/);
    const gid = gidMatch ? gidMatch[1] : '0';
    const sheetId = idMatch[1];

    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}`;
    console.info('嘗試 CSV:', csvUrl);

    const res = await fetch(csvUrl);
    console.info('CSV status:', res.status, res.url);
    if(!res.ok) throw new Error('CSV 端點讀取失敗,請確認試算表已設為「知道連結的任何人皆可檢視」');

    const text = await res.text();
    if(text.trim().startsWith('<')) throw new Error('回傳的是 HTML 不是資料,通常代表權限沒開對,或是連結格式不正確');

    const parsedCsv = Papa.parse(text, { header:true, skipEmptyLines:true });
    if(parsedCsv.errors && parsedCsv.errors.length) console.warn('Papa.parse CSV errors:', parsedCsv.errors);
    if(!parsedCsv.data || !parsedCsv.data.length) throw new Error('試算表目前是空的');

    const map = buildHeaderMap(parsedCsv.meta.fields || []);
    console.info('CSV headers:', parsedCsv.meta.fields);
    console.info('buildHeaderMap result:', map);
    if(!map.company || !map.title) throw new Error('找不到 company 或 title 欄位,請檢查第一列欄位名稱');

    const jobs = parsedCsv.data.map((row,i)=> rowToJob(row, map, i)).filter(j=> j.company && j.title);
    if(!jobs.length) throw new Error('每一列都缺少公司或職稱,請檢查資料內容');

    DATA = jobs;
    console.info(`職缺地圖:已從 Google 試算表載入 ${jobs.length} 筆職缺`);

    // 成功後更新 UI
    state.activeId = null;
    rebuildCategoryUI();
    rebuildShiftUI();
    rebuildRestUI();
    rebuildCityUI();
    renderStats();
    update();
    openJobFromUrlParam();
  }catch(err){
    console.error('職缺地圖:讀取 Google 試算表失敗 —', err.message);
    console.debug(err);
    // 真的連不上試算表時,才退回顯示範例資料當備案,不要讓使用者一直卡在載入畫面
    if(DATA === DEMO_DATA){
      rebuildCategoryUI();
      rebuildShiftUI();
      rebuildRestUI();
      rebuildCityUI();
      renderStats();
      update();
    }
  }
}

// 背景 3D 地球:發光網絡點狀風格,平滑跟隨捲動距離轉動(有慣性感),同時疊加緩慢自轉,不會死板
(function(){
  if(typeof THREE === 'undefined') return;
  const container = document.getElementById('bgGlobe');
  if(!container) return;

  const width = container.clientWidth, height = container.clientHeight;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 1000);
  camera.position.z = 5.4;

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  container.appendChild(renderer.domElement);

  const globeGroup = new THREE.Group();
  globeGroup.rotation.x = 0.3; // 固定傾斜角度,避免看起來太死板
  scene.add(globeGroup);

  // 經緯線框架
  const wireGeo = new THREE.SphereGeometry(2, 18, 12);
  const wireMat = new THREE.MeshBasicMaterial({ color: 0x7C93F2, wireframe:true, transparent:true, opacity:0.16 });
  globeGroup.add(new THREE.Mesh(wireGeo, wireMat));

  // 網絡光點(用費氏球面均勻分佈,模擬節點/城市光點)
  const dotCount = 900;
  const positions = new Float32Array(dotCount*3);
  const colors = new Float32Array(dotCount*3);
  // 以冷色系(青綠、藍紫)為主,跟深藍背景協調;金色只當稀疏點綴,不要五色平均散佈太花
  const mainPalette = [[0x4F,0xBF,0xAE],[0x7C,0x93,0xF2],[0x5F,0xA8,0xD3],[0x4F,0xBF,0xAE],[0x7C,0x93,0xF2]];
  const accentColor = [0xF2,0xA9,0x3D];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  for(let i=0;i<dotCount;i++){
    const y = 1 - (i/(dotCount-1))*2;
    const radiusAtY = Math.sqrt(Math.max(0, 1-y*y));
    const theta = goldenAngle * i;
    const x = Math.cos(theta)*radiusAtY;
    const z = Math.sin(theta)*radiusAtY;
    positions[i*3] = x*2.03; positions[i*3+1] = y*2.03; positions[i*3+2] = z*2.03;
    const c = (i % 9 === 0) ? accentColor : mainPalette[i % mainPalette.length]; // 每 9 顆才出現一顆金色點綴
    colors[i*3] = c[0]/255; colors[i*3+1] = c[1]/255; colors[i*3+2] = c[2]/255;
  }
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  dotGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const dotMat = new THREE.PointsMaterial({ size:0.032, vertexColors:true, transparent:true, opacity:0.9, sizeAttenuation:true });
  globeGroup.add(new THREE.Points(dotGeo, dotMat));

  let targetRotY = 0, currentRotY = 0, idleT = 0;
  window.addEventListener('scroll', ()=>{
    targetRotY = window.scrollY * 0.0016; // 捲動距離換算成目標旋轉角度
  }, { passive:true });

  const FRAME_INTERVAL = 1000/30; // 限制在約 30fps,不用跟捲動全速搶資源
  let lastFrameTime = 0;
  function animate(now){
    requestAnimationFrame(animate);
    if(document.hidden) return; // 分頁切到背景時暫停渲染,節省效能
    if(now - lastFrameTime < FRAME_INTERVAL) return;
    lastFrameTime = now;
    idleT += 0.0024; // 緩慢自轉,就算不捲動也不會死氣沉沉(降頻率後補一點速度維持原本手感)
    currentRotY += (targetRotY - currentRotY) * 0.1; // 平滑跟隨,製造自然的慣性感,不是瞬間對應
    globeGroup.rotation.y = currentRotY + idleT;
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', ()=>{
    const w = container.clientWidth, h = container.clientHeight;
    if(!w || !h) return;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();

// 回到頂端按鈕:捲動超過一段距離才出現,點擊平滑捲回最上方
(function(){
  const btn = document.getElementById('backToTopBtn');
  if(!btn) return;
  const SHOW_AFTER = 500;
  window.addEventListener('scroll', ()=>{
    btn.classList.toggle('visible', window.scrollY > SHOW_AFTER);
  }, { passive: true });
  btn.addEventListener('click', ()=>{
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

// 桌面版:往下捲動就自動收合篩選列,往上捲動就自動展開回來(手機版走底部滑出面板,不受影響)
(function(){
  const filterbarEl = document.getElementById('filterbar');
  if(!filterbarEl) return;
  const SCROLL_THRESHOLD = 120; // 至少往下捲動這麼多才開始收合,避免一開始滑一點點就收起來
  const DIRECTION_BUFFER = 28; // 同一個方向要累積這麼多距離才會真的觸發切換,過濾掉細微的抖動(加大避免誤判)
  const TRANSITION_MS = 320; // 需與 CSS .filterbar 的 transition 時間一致
  const SETTLE_MS = 90; // 動畫結束後,再多等一小段時間讓瀏覽器的捲動位置穩定下來
  const MIN_TOGGLE_INTERVAL = TRANSITION_MS + SETTLE_MS; // 一定要等上一次收合/展開動畫真正做完,才允許下一次切換

  let lastY = window.scrollY;
  let accumUp = 0, accumDown = 0;
  let isCollapsed = false;
  let lastToggleTime = 0;
  let ticking = false;
  let animating = false; // 收合/展開動畫進行中時鎖住,避免版面高度變化又觸發捲動事件,形成「收合→展開→收合…」的連鎖抖動

  function setCollapsed(next, now){
    if(next === isCollapsed || animating) return;
    filterbarEl.classList.toggle('collapsed', next);
    isCollapsed = next;
    lastToggleTime = now;
    accumUp = 0; accumDown = 0;
    animating = true;
    // 篩選列的高度變化,可能讓瀏覽器悄悄修正目前的捲動位置(尤其頁面靠近底部時),
    // 這會被誤判成「使用者又捲動了一次」而立刻觸發下一次切換。等動畫真正結束後,
    // 重新校正 lastY 當作新基準,避免這種假捲動造成的抖動/卡頓。
    setTimeout(()=>{
      animating = false;
      lastY = window.scrollY;
      accumUp = 0; accumDown = 0;
    }, MIN_TOGGLE_INTERVAL);
  }

  function handleScroll(){
    const isDesktop = window.matchMedia('(min-width: 721px)').matches;
    if(!isDesktop){
      if(isCollapsed){ filterbarEl.classList.remove('collapsed'); isCollapsed = false; }
      lastY = window.scrollY;
      ticking = false;
      return;
    }

    if(animating){ ticking = false; return; } // 動畫進行中,先不累積捲動距離,避免高度變化造成的假訊號

    const currentY = window.scrollY;
    const delta = currentY - lastY;
    lastY = currentY;
    if(delta > 0){ accumDown += delta; accumUp = 0; }
    else if(delta < 0){ accumUp += -delta; accumDown = 0; }

    const now = performance.now();
    const canToggle = (now - lastToggleTime) > MIN_TOGGLE_INTERVAL;

    if(currentY <= SCROLL_THRESHOLD){
      if(canToggle) setCollapsed(false, now);
    } else if(accumDown > DIRECTION_BUFFER && canToggle){
      setCollapsed(true, now);
    } else if(accumUp > DIRECTION_BUFFER && canToggle){
      setCollapsed(false, now);
    }

    ticking = false;
  }

  window.addEventListener('scroll', ()=>{
    if(!ticking){
      requestAnimationFrame(handleScroll);
      ticking = true;
    }
  }, { passive: true });
})();
